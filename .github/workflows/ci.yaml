name: Notes API CI

on:
  push:
    branches:
      - dev
      - 'feature/**'

  pull_request:
    branches:
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    #permissions: This section defines the permissions for the GITHUB_TOKEN. 
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Build TypeScript
        run: npm run build


  docker-publish:
    # build and publish Docker image only on push events to the dev branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'  
    needs: test
    runs-on: ubuntu-latest

    # permissions are scoped to individual jobs when declared at the job level.
    # These permissionsare given to the token that is automatically generated by GitHub for each workflow run. This token is used to authenticate with the GitHub Container Registry (GHCR) when publishing Docker images.
    permissions:
      contents: read # public repositories do not require this permission, but private repositories do
      packages: write # grants the token the required publishing permission

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3  # Reusable action for authenticating Docker to a registry
        with:
          registry: ghcr.io # GitHub Container Registry
          username: ${{ github.actor }} #GitHub account or app that triggered the workflow
          password: ${{ secrets.GITHUB_TOKEN }} # GitHub-provided authentication token for the workflow

      - name: Build Docker image
        run: docker build -t ghcr.io/wayungi/notes-api:${{ github.sha }} . #IMPORTANT NOTE: Github Action runners come with docker pre-installed.

      - name: Push Docker image to GHCR
        run: docker push ghcr.io/wayungi/notes-api:${{ github.sha }}

  deploy:
    name: Deploy Notes API to Ubuntu
    needs: docker-publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Configure SSH private key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.NOTES_DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy Notes API
        env:
          DEPLOY_HOST: ${{ secrets.NOTES_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.NOTES_DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.NOTES_DEPLOY_KNOWN_HOSTS }}
        run: |
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo -n /usr/local/sbin/deploy-notes-api ghcr.io/wayungi/notes-api:${{ github.sha }}"

            
# uses: invokes an existing GitHub Action.
# runs: executes a shell command.
# needs: establishes a dependency between jobs, ensuring that the current job will only run after the specified job(s) have completed successfully.
# with: Supplies input parameters to the action


# Story time
# GitHub Actions provides a GITHUB_TOKEN. GitHub automatically creates a token for each workflow job.
# We can use this token to authenticate to GHCR without manually creating and storing a personal access token.
# However, we must give the publishing job appropriate permissions.

#before a push, GHCR needs to establish two things:
# Authentication: Who is attempting to publish this image?
# Authorization: Does that identity have permission to publish to this container package?


