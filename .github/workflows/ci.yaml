name: Notes API CI

on:
  push:
    branches:
      - dev
      - 'feature/**'

  pull_request:
    branches:
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Build TypeScript
        run: npm run build




# uses: invokes an existing GitHub Action.
# runs: executes a shell command.
# needs: establishes a dependency between jobs, ensuring that the current job will only run after the specified job(s) have completed successfully.
# with: Supplies input parameters to the action
